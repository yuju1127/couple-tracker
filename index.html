<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>我們的記帳與健康日誌</title>
<style>
:root{--bg:#FDFBF7;--card:#FFFFFF;--ink:#2D3748;--sub:#8B8479;--line:#EFE9E0;--pri:#D97757;--pri2:#F8EDE6;--danger:#C9615A;
  --shadow:0 4px 20px rgba(0,0,0,.04);--radius:16px}
@media (prefers-color-scheme:dark){:root{--bg:#1E1C1A;--card:#2A2724;--ink:#F1ECE6;--sub:#A39B90;--line:#3A3631;--pri:#E58E6F;--pri2:#3E322C;--danger:#E08A84;--shadow:0 4px 20px rgba(0,0,0,.25)}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Noto Sans TC","Microsoft JhengHei",sans-serif;padding-bottom:84px;-webkit-font-smoothing:antialiased}
header{background:var(--card);box-shadow:var(--shadow);padding:16px 20px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:5}
h1{font-size:18px;margin:0;font-weight:700;letter-spacing:.3px}
main{padding:20px 16px 0;max-width:560px;margin:0 auto}
.card{background:var(--card);border-radius:var(--radius);padding:22px 20px;margin:0 0 20px;box-shadow:var(--shadow)}
.card h2{font-size:15px;font-weight:700;margin:0 0 14px}
label{display:block;font-size:13px;color:var(--sub);margin:12px 0 5px}
input,select,button{font:inherit;color:inherit}
input,select{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:12px;background:var(--bg);outline:none}
input:focus,select:focus{border-color:var(--pri);box-shadow:0 0 0 3px var(--pri2)}
.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.btn{background:var(--pri);color:#fff;border:0;border-radius:12px;padding:13px 16px;width:100%;margin-top:18px;font-weight:700;cursor:pointer;box-shadow:0 4px 12px rgba(217,119,87,.25)}
.btn:active{transform:translateY(1px)}
.btn.ghost{background:var(--pri2);color:var(--ink);margin-top:0;box-shadow:none}
.seg{display:flex;background:var(--pri2);border-radius:14px;padding:4px;gap:4px}
.seg button{flex:1;border:0;background:transparent;border-radius:11px;padding:9px;cursor:pointer;font-weight:600;color:var(--sub)}
.seg button.on{background:var(--card);color:var(--ink);font-weight:700;box-shadow:0 2px 8px rgba(0,0,0,.06)}
.big{font-size:30px;font-weight:700;color:var(--pri);line-height:1.2}
.sub{color:var(--sub);font-size:13px}
.item{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:14px 0;border-top:1px solid var(--line)}
.item:first-of-type{border-top:0;padding-top:0}
.item .l{min-width:0}.item .t{overflow-wrap:anywhere;font-weight:600}
.item .r{white-space:nowrap;font-weight:700}
.x{background:none;border:0;color:var(--danger);font-size:18px;cursor:pointer;padding:4px 8px}
.ed{background:none;border:0;color:var(--sub);font-size:16px;cursor:pointer;padding:4px 6px}
dialog{border:0;border-radius:var(--radius);padding:22px 20px;width:min(92vw,420px);background:var(--card);color:var(--ink);box-shadow:0 12px 40px rgba(0,0,0,.18)}
dialog::backdrop{background:rgba(45,55,72,.35)}
.tag{display:inline-block;font-size:12px;background:var(--pri2);border-radius:999px;padding:1px 9px;margin-right:6px}
.badge{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600;border-radius:999px;padding:3px 10px;margin-right:6px;white-space:nowrap}
nav{position:fixed;bottom:0;left:0;right:0;background:var(--card);box-shadow:0 -4px 20px rgba(0,0,0,.05);display:flex;padding-bottom:env(safe-area-inset-bottom);z-index:5}
nav button{flex:1;border:0;background:none;padding:14px 4px;cursor:pointer;color:var(--sub);font-weight:600}
nav button.on{color:var(--pri)}
.empty{color:var(--sub);text-align:center;padding:18px 0;font-size:14px}
svg{width:100%;height:auto;display:block}
/* 當月總覽 */
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.top .mi{width:auto;padding:7px 10px;font-size:14px}
.total{font-size:40px;font-weight:700;color:var(--pri);line-height:1.15;margin:4px 0 0;letter-spacing:-.5px}
.pay{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:18px}
.pay>div{background:var(--bg);border-radius:14px;padding:12px 14px}
.pay .n{font-size:13px;color:var(--sub)}
.pay .v{font-size:20px;font-weight:700;margin-top:2px}
.trk{display:flex;height:10px;border-radius:999px;overflow:hidden;background:var(--line);box-shadow:0 1px 3px rgba(0,0,0,.08)}
.trk b{display:block;min-width:0;border-right:2px solid var(--card)}
.trk b:last-child{border-right:0}
.cl{margin-top:16px}
.cr{display:flex;justify-content:space-between;align-items:center;padding:8px 0;font-size:14px}
.cr .a{font-weight:700}
.cr em{font-style:normal;color:var(--sub);font-weight:500;font-size:12px;margin-left:6px}
.pbox{padding:11px 12px;border-radius:12px;background:var(--pri2);font-weight:700}
.who2{display:flex;flex-direction:column;align-items:flex-end;gap:5px;min-width:0;max-width:55%}
.who2 #userName{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ghost-s{border:0;background:var(--pri2);border-radius:999px;padding:4px 14px;font-size:13px;cursor:pointer;font-weight:600}
#login{position:fixed;inset:0;z-index:50;background:var(--bg);display:flex;align-items:center;justify-content:center}
#login.hidden{display:none}
.acts{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin:0 0 20px}
.act{border:0;border-radius:var(--radius);background:var(--card);box-shadow:var(--shadow);padding:16px 10px;font-weight:700;font-size:16px;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px;color:var(--ink)}
.act span{font-size:20px}
.act:active{transform:translateY(1px)}
.big-dlg{max-height:88vh;overflow:auto}
.dh{display:flex;justify-content:space-between;align-items:center;margin-bottom:4px}
.dh h2{margin:0;font-size:17px}
.dclose{border:0;background:var(--pri2);border-radius:999px;width:32px;height:32px;font-size:20px;line-height:1;cursor:pointer}
.has-cat{position:relative;margin-top:78px}
.cat{position:absolute;right:-16px;top:-56px;width:140px;height:auto;pointer-events:none;overflow:visible;z-index:2}
:root{--cat:#1d1d22;--cat-tip:#6a6a73}
@media (prefers-color-scheme:dark){:root{--cat:#44444e;--cat-tip:#8a8a95}}
.cat .tail{transform-origin:146px 60px;animation:sway 2.6s ease-in-out infinite alternate}
.cat .breath{transform-origin:80px 60px;animation:breath 3.6s ease-in-out infinite}
.cat .ear{transform-origin:68px 28px;animation:twitch 7s ease-in-out infinite}
.cat .eyes{transform-box:fill-box;transform-origin:50% 0;animation:blink 6s infinite}
@keyframes sway{from{transform:rotate(-9deg)}to{transform:rotate(10deg)}}
@keyframes breath{0%,100%{transform:scaleY(1)}50%{transform:scaleY(1.05)}}
@keyframes twitch{0%,90%,100%{transform:rotate(0)}93%{transform:rotate(10deg)}96%{transform:rotate(-3deg)}}
@keyframes blink{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(.08)}}
.cat2{position:absolute;left:10px;top:-95px;width:104px;height:auto;pointer-events:none;overflow:visible;z-index:2}
.cat2 .t2head{transform-origin:60px 54px;animation:lick 2.6s ease-in-out infinite}
.cat2 .t2tongue{transform-box:fill-box;transform-origin:50% 0;animation:tongue 2.6s ease-in-out infinite}
.cat2 .t2leg{transform-origin:84px 88px;animation:legq 2.6s ease-in-out infinite}
.cat2 .t2tail{transform-origin:96px 90px;animation:t2sway 3.4s ease-in-out infinite alternate}
@keyframes lick{0%,10%,100%{transform:translateY(0) rotate(0)}24%{transform:translateY(12px) rotate(-4deg)}34%{transform:translateY(8px) rotate(-2deg)}46%{transform:translateY(12px) rotate(-4deg)}56%{transform:translateY(8px) rotate(-2deg)}68%{transform:translateY(12px) rotate(-4deg)}82%{transform:translateY(0) rotate(0)}}
@keyframes tongue{0%,20%,100%{opacity:0;transform:scale(.4)}26%,32%{opacity:1;transform:scale(1)}38%,42%{opacity:0;transform:scale(.4)}48%,54%{opacity:1;transform:scale(1)}60%,64%{opacity:0;transform:scale(.4)}70%,76%{opacity:1;transform:scale(1)}84%{opacity:0}}
@keyframes legq{0%,100%{transform:rotate(0)}30%,50%,72%{transform:rotate(-2.5deg)}40%,60%{transform:rotate(1.5deg)}}
@keyframes t2sway{from{transform:rotate(-4deg)}to{transform:rotate(5deg)}}
@media (prefers-reduced-motion:reduce){.cat *,.cat2 *{animation:none!important}}
.hidden{display:none}
</style>
</head>
<body>
<div id="login">
  <div class="card" style="width:min(92vw,360px)">
    <h2 style="font-size:17px">🏠 我們的小日子</h2>
    <div id="loginLoading" class="sub">載入中…</div>
    <form id="loginForm" class="hidden">
      <label>Email</label><input name="email" type="email" autocomplete="username" required>
      <label>密碼</label><input name="password" type="password" autocomplete="current-password" required>
      <button class="btn">登入</button>
    </form>
    <div class="sub" id="loginMsg" style="margin-top:8px;color:var(--danger)"></div>
  </div>
</div>
<header>
  <div><h1>🏠 我們的小日子</h1><div class="sub" id="today"></div></div>
  <div class="who2"><span id="userName" class="sub"></span><button id="logout" class="ghost-s">登出</button></div>
</header>
<main>
<!-- 記帳 -->
<section id="tab-money">
  <div class="card has-cat">
    <svg class="cat" viewBox="0 0 150 112" aria-hidden="true">
      <g class="tail"><path d="M124 56 C140 56 146 58 146 68 L146 104" fill="none" stroke="var(--cat)" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/><circle cx="146" cy="104" r="4.6" fill="var(--cat-tip)"/></g>
      <g class="breath"><path d="M30 60 C26 36 54 21 86 21 C116 21 134 38 134 60 Z" fill="var(--cat)"/></g>
      <ellipse cx="48" cy="36" rx="20" ry="17" fill="var(--cat)"/>
      <path d="M29 28 L30 7 L46 20 Z" fill="var(--cat)"/>
      <g class="ear"><path d="M53 20 L68 8 L65 30 Z" fill="var(--cat)"/></g>
      <g class="eyes">
        <path d="M34.5 35 A5.6 4.2 0 0 0 45.7 35 Z" fill="#fff"/><ellipse cx="40.1" cy="36.2" rx="2" ry="2.3" fill="#111"/>
        <path d="M52.3 35 A5.6 4.2 0 0 0 63.5 35 Z" fill="#fff"/><ellipse cx="57.9" cy="36.2" rx="2" ry="2.3" fill="#111"/>
      </g>
      <path d="M46.5 42 L51 42 L48.8 44.4 Z" fill="#d9a0a0"/>
      <g stroke="#d6d6de" stroke-width="1" stroke-linecap="round" opacity=".75"><path d="M33 42 L19 39"/><path d="M33 45 L20 47"/><path d="M65 42 L77 40"/><path d="M65 45 L76 47"/></g>
    </svg>
    <div class="top">
      <div><div class="sub">本月可使用</div><div class="total" id="mLeft">$0</div></div>
      <input type="month" id="mMonth" class="mi" aria-label="月份">
    </div>
    <div id="mMeter" style="margin-top:14px"></div>
    <div class="pay">
      <div><div class="n">當月收入</div><div class="v" id="mIncome">$0</div></div>
      <div><div class="n">當月總花費</div><div class="v" id="mTotal">$0</div></div>
    </div>
    <div id="mByPayer"></div>
    <div id="mCats" style="margin-top:22px"></div>
  </div>
  <div class="acts">
    <button class="act" data-open="dlgInc"><span>💰</span>收入</button>
    <button class="act" data-open="dlgExp"><span>🧾</span>支出</button>
  </div>

  <dialog id="dlgInc" class="big-dlg">
    <div class="dh"><h2>收入</h2><button type="button" class="dclose" data-close="dlgInc" aria-label="關閉">×</button></div>
    <form id="iForm">
      <div class="row">
        <div><label>日期</label><input type="date" name="date" required></div>
        <div><label>收入者（登入帳號）</label><div id="incomeWho" class="pbox"></div></div>
      </div>
      <div class="row">
        <div><label>金額</label><input name="amount" type="number" min="0" step="any" inputmode="decimal" required></div>
        <div><label>備註</label><input name="name" placeholder="例如：薪水"></div>
      </div>
      <button class="btn">新增收入</button>
    </form>
    <h2 style="margin:24px 0 8px">當月收入明細 <span class="sub">（依上方所選月份）</span></h2>
    <div id="iList"></div>
  </dialog>

  <dialog id="dlgExp" class="big-dlg">
    <div class="dh"><h2>支出</h2><button type="button" class="dclose" data-close="dlgExp" aria-label="關閉">×</button></div>
    <form id="mForm">
      <div class="row">
        <div><label>日期</label><input type="date" name="date" required></div>
        <div><label>付款人（登入帳號）</label><div id="payerShow" class="pbox"></div></div>
      </div>
      <div><label>項目</label><select name="cat"></select></div>
      <div class="row">
        <div><label>金額</label><input name="amount" type="number" min="0" step="any" inputmode="decimal" required></div>
        <div><label>備註</label><input name="name"></div>
      </div>
      <button class="btn">新增花費</button>
    </form>
    <h2 style="margin:24px 0 8px">當月明細 <span class="sub">（依上方所選月份）</span></h2>
    <div id="mList"></div>
  </dialog>
</section>

<!-- 健康 -->
<section id="tab-health" class="hidden">
  <div class="card">
    <div class="seg" id="who"><button data-u="我" class="on">如如</button><button data-u="男友">桓桓</button></div>
  </div>
  <div class="card"><h2>體重趨勢 (kg)</h2><div id="chart"></div><div class="sub" id="wInfo"></div></div>
  <div class="card">
    <h2>今日摘要</h2>
    <div class="row"><div><div class="big" id="sumKcal">0</div><div class="sub">攝取 kcal</div></div>
    <div><div class="big" id="sumMin">0</div><div class="sub">運動 分鐘</div></div></div>
    <div class="sub">以下日期為你選擇的紀錄日</div>
    <label>檢視日期</label><input type="date" id="hDate">
  </div>
  <div class="card">
    <h2>記錄體重</h2>
    <form id="wForm"><div class="row">
      <div><label>日期</label><input type="date" name="date" required></div>
      <div><label>體重 (kg)</label><input name="kg" type="number" step="0.1" min="0" inputmode="decimal" required></div>
    </div><button class="btn">儲存</button></form>
  </div>
  <div class="card">
    <h2>記錄飲食</h2>
    <form id="fForm">
      <div class="row">
        <div><label>日期</label><input type="date" name="date" required></div>
        <div><label>餐別</label><select name="meal"><option>早餐</option><option>午餐</option><option>晚餐</option><option>點心</option></select></div>
      </div>
      <label>食物內容摘要</label><input name="food" required placeholder="例如：雞胸沙拉">
      <label>估算熱量 (kcal)</label><input name="kcal" type="number" min="0" inputmode="numeric" required>
      <button class="btn">儲存</button>
    </form>
  </div>
  <div class="card">
    <h2>記錄運動</h2>
    <form id="eForm">
      <div class="row">
        <div><label>日期</label><input type="date" name="date" required></div>
        <div><label>項目</label><select name="type"><option>重訓</option><option>跑步</option><option>TRX</option><option>其他</option></select></div>
      </div>
      <label>時間 (分鐘)</label><input name="min" type="number" min="0" inputmode="numeric" required>
      <button class="btn">儲存</button>
    </form>
  </div>
  <div class="card"><h2>當日日誌</h2><div id="hList"></div></div>
</section>

</main>
<dialog id="dlg"><form id="eDlg" method="dialog"><h2 style="font-size:16px;margin:0 0 4px">編輯紀錄</h2><div id="eFields"></div>
  <div class="row" style="margin-top:12px"><button type="button" class="btn ghost" id="eCancel" style="margin:0">取消</button><button class="btn" style="margin:0">儲存</button></div></form></dialog>
<nav>
  <button data-t="money" class="on">💰 記帳</button>
  <button data-t="health">🥗 健康</button>
</nav>

<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
import {getAuth,onAuthStateChanged,signInWithEmailAndPassword,signOut} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";
import {initializeFirestore,persistentLocalCache,persistentMultipleTabManager,collection,doc,setDoc,deleteDoc,onSnapshot} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js";

// Firebase 設定值本來就會公開在網頁中；真正的保護是 Firestore 安全規則 + 登入
const firebaseConfig={
  apiKey:"AIzaSyD0E3HCIXqPYZJMJ2NKSk5shJk6kP4Kdl4",
  authDomain:"couple-tracker-321ba.firebaseapp.com",
  projectId:"couple-tracker-321ba",
  storageBucket:"couple-tracker-321ba.firebasestorage.app",
  messagingSenderId:"356055224451",
  appId:"1:356055224451:web:7e6e901e2dae48c1350bb6"
};
const app=initializeApp(firebaseConfig);
const auth=getAuth(app);
const fsdb=initializeFirestore(app,{localCache:persistentLocalCache({tabManager:persistentMultipleTabManager()})});

const CATS=['房屋租金','電費','水費','瓦斯費','網路費','餐飲外食','食材採買','貓咪寵物','日用雜項','娛樂交通'];
// 莫蘭迪色與 Emoji，依 CATS 順序一一對應（新增分類時請一併補上）
const CAT_COLORS=['#C98B6B','#E0B861','#7FA6B5','#C9715F','#8F9FB8','#B5838D','#8FAE8B','#A68BA6','#B7A58E','#6F8F8B'];
const CAT_ICONS=['🏠','⚡','💧','🔥','🌐','🍜','🛒','🐱','🛍️','🚗'];
const catColor=c=>CAT_COLORS[CATS.indexOf(c)]||'#B7A58E';
const catBadge=c=>`<span class="badge" style="background:${catColor(c)}2E">${CAT_ICONS[CATS.indexOf(c)]||'📌'} ${esc(c)}</span>`;
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const todayStr=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,8);
const COLL=['expenses','incomes','weights','meals','workouts'];

// db 是雲端資料的即時鏡像，由 onSnapshot 更新
let db={expenses:[],incomes:[],weights:[],meals:[],workouts:[]};
// 內部以「我 / 男友」儲存，畫面顯示暱稱
const NAMES={'我':'如如','男友':'桓桓'};
const nm=u=>NAMES[u]||u;
// 登入帳號 UID → 內部身分（付款人、個人日誌預設都跟著登入帳號走）
const UID_MAP={
  '3MFA5p4ccnNSGuyCUmAb9x1c1Ct1':'我',      // 如如 soyeon11822@gmail.com
  'zqep43JQB9M97aq6ootKndei7xo2':'男友'     // 桓桓 inno_chiou@gmail.com
};
let me=null; // 目前登入者的內部身分

// ---- Firestore 讀寫 ----
const run=p=>p.catch(e=>{console.error(e);alert('操作失敗：'+(e.code==='permission-denied'?'沒有權限，請確認登入的是正確帳號。':(e.message||e)))});
const save1=(coll,rec)=>{const {id,...rest}=rec;return run(setDoc(doc(fsdb,coll,id),rest))};
const del1=(coll,id)=>run(deleteDoc(doc(fsdb,coll,id)));
let unsubs=[],currentUser=null;
function startSync(){
  stopSync();
  COLL.forEach(k=>unsubs.push(onSnapshot(collection(fsdb,k),snap=>{
    db[k]=snap.docs.map(d=>({id:d.id,...d.data()}));render();
  },e=>{console.error(e);alert('讀取雲端資料失敗：'+(e.code==='permission-denied'?'沒有權限，請確認登入的是正確帳號。':e.message))})));
}
function stopSync(){unsubs.forEach(f=>f());unsubs=[];COLL.forEach(k=>db[k]=[]);}

// ---- 登入 ----
onAuthStateChanged(auth,u=>{
  currentUser=u;
  me=u?(UID_MAP[u.uid]||null):null;
  $('#userName').textContent=u?(me?`${nm(me)}（${u.email}）`:u.email):'';
  $('#payerShow').textContent=$('#incomeWho').textContent=me?nm(me):'未綁定的帳號';
  if(me){user=me;document.querySelectorAll('#who button').forEach(x=>x.classList.toggle('on',x.dataset.u===me))}
  $('#login').classList.toggle('hidden',!!u);
  $('#loginMsg').textContent='';
  $('#loginForm').classList.toggle('hidden',!!u);
  $('#loginLoading').classList.add('hidden');
  if(u)startSync();else{stopSync();render();}
});
$('#loginForm').onsubmit=async e=>{
  e.preventDefault();
  const f=new FormData(e.target);
  $('#loginMsg').textContent='登入中…';
  try{await signInWithEmailAndPassword(auth,f.get('email').trim(),f.get('password'));e.target.password.value=''}
  catch(err){$('#loginMsg').textContent='登入失敗，請確認帳號與密碼。'}
};
$('#logout').onclick=()=>{if(confirm('確定登出？'))signOut(auth)};

let user='我';

// init
$('#today').textContent=todayStr();
$('select[name=cat]').innerHTML=CATS.map(c=>`<option>${c}</option>`).join('');
document.querySelectorAll('input[type=date][name=date]').forEach(i=>i.value=todayStr());
$('#hDate').value=todayStr();
$('#mMonth').value=todayStr().slice(0,7);

// tabs
document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>{
  document.querySelectorAll('nav button').forEach(x=>x.classList.toggle('on',x===b));
  ['money','health'].forEach(t=>$('#tab-'+t).classList.toggle('hidden',t!==b.dataset.t));
  render();
});
document.querySelectorAll('#who button').forEach(b=>b.onclick=()=>{
  user=b.dataset.u;document.querySelectorAll('#who button').forEach(x=>x.classList.toggle('on',x===b));render();
});
$('#mMonth').onchange=render;
$('#hDate').onchange=render;

const fmt=n=>'$'+Math.round(n).toLocaleString();

function add(coll,rec){save1(coll,{id:uid(),...rec})}
function del(coll,id){if(!confirm('確定刪除這筆紀錄？'))return;del1(coll,id)}
window.del=del;

// 編輯：每種紀錄的可編輯欄位
const SCHEMA={
  incomes:[['date','日期','date'],['person','收入者',['我','男友']],['amount','金額','number'],['name','備註','text']],
  expenses:[['date','日期','date'],['payer','付款人',['我','男友']],['cat','項目',CATS],['amount','金額','number'],['name','備註','text']],
  weights:[['date','日期','date'],['kg','體重 (kg)','number','0.1']],
  meals:[['date','日期','date'],['meal','餐別',['早餐','午餐','晚餐','點心']],['food','食物內容摘要','text'],['kcal','估算熱量 (kcal)','number']],
  workouts:[['date','日期','date'],['type','項目',['重訓','跑步','TRX','其他']],['min','時間 (分鐘)','number']]
};
let editing=null;
function edit(coll,id){
  const rec=db[coll].find(r=>r.id===id);if(!rec)return;
  editing={coll,id};
  $('#eFields').innerHTML=SCHEMA[coll].map(([k,label,t,step])=>{
    const v=esc(rec[k]);
    const input=Array.isArray(t)
      ?`<select name="${k}">${t.map(o=>`<option value="${esc(o)}"${o===rec[k]?' selected':''}>${esc(k==='payer'||k==='person'?nm(o):o)}</option>`).join('')}</select>`
      :`<input name="${k}" type="${t}" value="${v}"${k==='name'?'':' required'}${t==='number'?` min="0" step="${step||'any'}" inputmode="decimal"`:''}>`;
    return `<label>${label}</label>${input}`;
  }).join('');
  $('#dlg').showModal();
}
window.edit=edit;
$('#eCancel').onclick=()=>$('#dlg').close();
$('#eDlg').onsubmit=e=>{
  if(!editing)return;
  const f=new FormData(e.target);
  const orig=db[editing.coll].find(r=>r.id===editing.id);
  if(orig){
    const rec={...orig};
    SCHEMA[editing.coll].forEach(([k,,t])=>{
      const v=f.get(k);rec[k]=(t==='number')?+v:(t==='text'?v.trim():v);
    });
    save1(editing.coll,rec);
  }
  editing=null;
};

$('#mForm').onsubmit=e=>{e.preventDefault();const f=new FormData(e.target);
  if(!me){alert('這個帳號尚未綁定付款人，無法新增花費。');return}
  add('expenses',{date:f.get('date'),payer:me,name:f.get('name').trim(),amount:+f.get('amount'),cat:f.get('cat')});
  e.target.name.value='';e.target.amount.value='';};
$('#iForm').onsubmit=e=>{e.preventDefault();const f=new FormData(e.target);
  if(!me){alert('這個帳號尚未綁定使用者，無法新增收入。');return}
  add('incomes',{date:f.get('date'),person:me,name:f.get('name').trim(),amount:+f.get('amount')});
  e.target.name.value='';e.target.amount.value='';};
$('#wForm').onsubmit=e=>{e.preventDefault();const f=new FormData(e.target);
  const date=f.get('date');
  db.weights.filter(w=>w.user===user&&w.date===date).forEach(w=>del1('weights',w.id)); // 同日同人只留一筆
  add('weights',{date,user,kg:+f.get('kg')});e.target.kg.value='';};
$('#fForm').onsubmit=e=>{e.preventDefault();const f=new FormData(e.target);
  add('meals',{date:f.get('date'),user,meal:f.get('meal'),food:f.get('food').trim(),kcal:+f.get('kcal')});
  e.target.food.value='';e.target.kcal.value='';};
$('#eForm').onsubmit=e=>{e.preventDefault();const f=new FormData(e.target);
  add('workouts',{date:f.get('date'),user,type:f.get('type'),min:+f.get('min')});e.target.min.value='';};

function item(l1,l2,r,coll,id){
  return `<div class="item"><div class="l"><div class="t">${l1}</div><div class="sub">${l2}</div></div><div class="r">${r}<button class="ed" aria-label="編輯" onclick="edit('${coll}','${id}')">✎</button><button class="x" aria-label="刪除" onclick="del('${coll}','${id}')">×</button></div></div>`;
}

function renderMoney(){
  const m=$('#mMonth').value||todayStr().slice(0,7);
  const list=db.expenses.filter(x=>x.date.startsWith(m)).sort((a,b)=>b.date.localeCompare(a.date));
  const total=list.reduce((s,x)=>s+x.amount,0);
  $('#mTotal').textContent=fmt(total);
  const ilist=db.incomes.filter(x=>x.date.startsWith(m)).sort((a,b)=>b.date.localeCompare(a.date));
  const income=ilist.reduce((s,x)=>s+x.amount,0);
  const left=income-total;
  $('#mIncome').textContent=fmt(income);
  $('#mLeft').textContent=(left<0?'-':'')+fmt(Math.abs(left));
  $('#mLeft').style.color=left<0?'var(--danger)':'';
  const pct=income>0?total/income*100:(total>0?100:0);
  $('#mMeter').innerHTML=income>0||total>0?`<div class="trk" role="img" aria-label="已花費佔收入 ${Math.round(pct)}%"><b style="width:${Math.min(100,pct)}%;background:${left<0?'var(--danger)':'var(--pri)'}"></b></div><div class="sub" style="margin-top:6px">${income>0?`已花 ${Math.round(pct)}% 的收入`:'本月還沒有輸入收入'}</div>`:'<div class="sub">本月還沒有輸入收入</div>';
  $('#iList').innerHTML=ilist.length?ilist.map(x=>item(esc(x.name||'收入'),`${esc(x.date)} · ${esc(nm(x.person))}`,fmt(x.amount),'incomes',x.id)).join(''):'<div class="empty">這個月還沒有收入紀錄</div>';
  const by={我:0,男友:0};list.forEach(x=>by[x.payer]=(by[x.payer]||0)+x.amount);
  $('#mByPayer').innerHTML=`<div class="pay"><div><div class="n">${esc(nm('我'))}花了</div><div class="v">${fmt(by['我'])}</div></div><div><div class="n">${esc(nm('男友'))}花了</div><div class="v">${fmt(by['男友'])}</div></div></div>`;
  const cat={};list.forEach(x=>{cat[x.cat]=(cat[x.cat]||0)+x.amount});
  const rows=Object.entries(cat).sort((a,b)=>b[1]-a[1]);
  $('#mCats').innerHTML=rows.length?`<div class="trk" role="img" aria-label="當月各分類花費佔比">${rows.map(([c,v])=>`<b style="width:${v/total*100}%;background:${catColor(c)}" title="${esc(c)} ${fmt(v)}"></b>`).join('')}</div>
    <div class="cl">${rows.map(([c,v])=>`<div class="cr"><span>${catBadge(c)}</span><span><span class="a">${fmt(v)}</span><em>${Math.round(v/total*100)}%</em></span></div>`).join('')}</div>`:'';
  $('#mList').innerHTML=list.length?list.map(x=>item(esc(x.name||x.cat),`${esc(x.date)} · ${catBadge(x.cat)}${esc(nm(x.payer))}付`,fmt(x.amount),'expenses',x.id)).join(''):'<div class="empty">這個月還沒有花費紀錄</div>';
}

function chart(pts){
  if(!pts.length)return '<div class="empty">還沒有體重紀錄</div>';
  const W=320,H=150,p=28;
  const ys=pts.map(q=>q.kg);let lo=Math.min(...ys),hi=Math.max(...ys);
  if(hi-lo<1){lo-=.5;hi+=.5}
  const x=i=>pts.length===1?W/2:p+i*(W-2*p)/(pts.length-1);
  const y=v=>H-p-(v-lo)/(hi-lo)*(H-2*p);
  const path=pts.map((q,i)=>(i?'L':'M')+x(i).toFixed(1)+' '+y(q.kg).toFixed(1)).join(' ');
  const dots=pts.map((q,i)=>`<circle cx="${x(i).toFixed(1)}" cy="${y(q.kg).toFixed(1)}" r="3.5" fill="var(--pri)"><title>${esc(q.date)}：${q.kg} kg</title></circle>`).join('');
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="體重趨勢圖">
    <line x1="${p}" y1="${H-p}" x2="${W-p}" y2="${H-p}" stroke="var(--line)"/>
    <text x="4" y="${y(hi)+4}" font-size="10" fill="var(--sub)">${hi.toFixed(1)}</text>
    <text x="4" y="${y(lo)+4}" font-size="10" fill="var(--sub)">${lo.toFixed(1)}</text>
    <path d="${path}" fill="none" stroke="var(--pri)" stroke-width="2.5" stroke-linejoin="round"/>${dots}
    <text x="${p}" y="${H-8}" font-size="10" fill="var(--sub)">${esc(pts[0].date.slice(5))}</text>
    <text x="${W-p}" y="${H-8}" font-size="10" fill="var(--sub)" text-anchor="end">${esc(pts[pts.length-1].date.slice(5))}</text></svg>`;
}

function renderHealth(){
  const pts=db.weights.filter(w=>w.user===user).sort((a,b)=>a.date.localeCompare(b.date)).slice(-30);
  $('#chart').innerHTML=chart(pts);
  $('#wInfo').textContent=pts.length>1?`最新 ${pts[pts.length-1].kg} kg，較首筆 ${(pts[pts.length-1].kg-pts[0].kg>0?'+':'')+(pts[pts.length-1].kg-pts[0].kg).toFixed(1)} kg（最近 ${pts.length} 筆）`:(pts.length?`最新 ${pts[0].kg} kg`:'');
  const d=$('#hDate').value||todayStr();
  const meals=db.meals.filter(x=>x.user===user&&x.date===d);
  const ws=db.workouts.filter(x=>x.user===user&&x.date===d);
  const wt=db.weights.filter(x=>x.user===user&&x.date===d);
  $('#sumKcal').textContent=meals.reduce((s,x)=>s+x.kcal,0).toLocaleString();
  $('#sumMin').textContent=ws.reduce((s,x)=>s+x.min,0);
  const order=['早餐','午餐','晚餐','點心'];
  const html=[
    ...wt.map(x=>item('體重',esc(x.date),x.kg+' kg','weights',x.id)),
    ...meals.sort((a,b)=>order.indexOf(a.meal)-order.indexOf(b.meal)).map(x=>item(esc(x.food),`<span class="tag">${esc(x.meal)}</span>`,x.kcal+' kcal','meals',x.id)),
    ...ws.map(x=>item(esc(x.type),'運動',x.min+' 分鐘','workouts',x.id))
  ];
  $('#hList').innerHTML=html.length?html.join(''):`<div class="empty">${esc(nm(user))}在這天沒有紀錄</div>`;
}

function render(){renderMoney();renderHealth()}

// 收入 / 支出視窗
document.querySelectorAll('[data-open]').forEach(b=>b.onclick=()=>$('#'+b.dataset.open).showModal());
document.querySelectorAll('[data-close]').forEach(b=>b.onclick=()=>$('#'+b.dataset.close).close());
document.querySelectorAll('.big-dlg').forEach(d=>d.addEventListener('click',e=>{const r=d.getBoundingClientRect();if(e.target===d&&(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom))d.close()}));

render();
</script>
